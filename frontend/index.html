<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstanteViva</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>




    <nav>
        <h1>Estante Viva</h1>

        <div class="link">
            <a>Catálogo</a>
            <a>Cadastro</a>
        </div>

    </nav>

    <main>

        <h2>Gerenciamento de Livros</h2>


        <form id="bookform" novalidate>
            <h3>Cadastrar livro</h3>

            <div class="campos">

                <div class="titulo">


                    <label>Titulo *</label>
                    <input class="tam" type="text" id="title" placeholder= "informe o título">
                </div>


                <div class="titulo">
                    <label>Autor *</label>
                    <input type="text" id="autor" placeholder= "informe o autor">
                </div>
            </div>
            
            


            <div class="campos">
                <div class="titulo">

                    <label>Preço (R$) *</label>
                    <input type="number" id="preco" placeholder="0,00">
                </div>

                <div class="titulo">
                    <label>Quantidade em estoque *</label>
                    <input type="number" id="quantidade" placeholder="0">
                </div>

                <button class="cadastro">Cadastrar livro</button>
            </div>

        </form>
         

        <div class="livro">
        <h3>Catálogo de livros</h3>
        <div class="pesquisar">
        <input type="text" id= "catalogo" placeholder="Buscar por parte do título">

        <button class="botao">Buscar</button>
        <button class="botao">Limpar</button>
        </div>
    </div>

        <div id="lista-usuarios" class="containerUsuario">
        <table>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>

            <tr>
                <td>Título cadastrado</td>
                <td>Nome do Autor</td>
                <td>R$ 0,00</td>
                <td>0</td>
                <td><button class="botao">Editar</button><button class="botao">Excluir</button></td>
            </tr>

            <tr>
                <td>Título cadastrado</td>
                <td>Nome do Autor</td>
                <td>R$ 0,00</td>
                <td>0</td>
                <td><button class="botao">Editar</button><button class="botao">Excluir</button></td>
            </tr>
        </table>
        </div>
    </main>

    


        <footer>
            <p>Estante Viva - Gerenciamento de catálogo</p>
        </footer>

<div id="lista-usuarios" class="containerUsuario"></div>


<script src="script.js">
    
</script>

    
</body>

</html>
